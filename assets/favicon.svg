<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="102" fill="#1A1B1E"/>
  <g transform="translate(256,256)" fill="none" stroke="#FF6A00" stroke-linecap="round" stroke-linejoin="round">
    <!-- Basketball circle -->
    <circle cx="0" cy="0" r="120" stroke-width="10"/>

    <!-- Basketball seam — single horizontal arc -->
    <path d="M-120 0 Q0,-82, 120 0" stroke-width="6"/>

    <!-- Basketball seam — single vertical arc -->
    <path d="M0 -120 Q82,0, 0 120" stroke-width="6"/>

    <!-- Crosshair lines -->
    <line x1="0" y1="-140" x2="0" y2="-170" stroke-width="8"/>
    <line x1="0" y1="140" x2="0" y2="170" stroke-width="8"/>
    <line x1="-140" y1="0" x2="-170" y2="0" stroke-width="8"/>
    <line x1="140" y1="0" x2="170" y2="0" stroke-width="8"/>

    <!-- Crosshair tick marks -->
    <line x1="-14" y1="-170" x2="14" y2="-170" stroke-width="7"/>
    <line x1="-14" y1="170" x2="14" y2="170" stroke-width="7"/>
    <line x1="-170" y1="-14" x2="-170" y2="14" stroke-width="7"/>
    <line x1="170" y1="-14" x2="170" y2="14" stroke-width="7"/>

    <!-- Signal waves — left -->
    <path d="M-156,-54 Q-180,-26, -180,0 Q-180,26, -156,54" stroke-width="8"/>
    <path d="M-172,-80 Q-204,-40, -204,0 Q-204,40, -172,80" stroke-width="7" opacity="0.6"/>

    <!-- Signal waves — right -->
    <path d="M156,-54 Q180,-26, 180,0 Q180,26, 156,54" stroke-width="8"/>
    <path d="M172,-80 Q204,-40, 204,0 Q204,40, 172,80" stroke-width="7" opacity="0.6"/>
  </g>
</svg>
