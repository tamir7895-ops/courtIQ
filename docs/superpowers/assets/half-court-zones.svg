<svg viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg" fill="none" preserveAspectRatio="xMidYMid meet">
  <!--
    CourtIQ — NBA Half-Court with 9 Shot Zones
    Orientation: Rim at TOP, half-court at BOTTOM
    Scale: 10 units = 1 foot

    ZONES (set fill dynamically for heatmap):
      z-paint        Paint / Key
      z-mid-l        Left Mid-Range
      z-mid-r        Right Mid-Range
      z-mid-top      Top Mid-Range
      z-corner3-l    Left Corner 3
      z-corner3-r    Right Corner 3
      z-wing3-l      Left Wing 3
      z-wing3-r      Right Wing 3
      z-top3         Top of Key 3
  -->
  <defs>
    <style>
      .cl { stroke: rgba(255,255,255,0.22); stroke-width: 1.5; fill: none; }
      .cld { stroke: rgba(255,255,255,0.22); stroke-width: 1.5; fill: none; stroke-dasharray: 8 6; }
      .zone { stroke: rgba(255,255,255,0.06); stroke-width: 0.5; }
      .zone-default { fill: rgba(255,255,255,0.04); }
    </style>
    <clipPath id="c3"><rect x="0" y="142" width="500" height="328"/></clipPath>
    <clipPath id="ftb"><rect x="0" y="190" width="500" height="280"/></clipPath>
    <clipPath id="ftt"><rect x="0" y="0" width="500" height="190"/></clipPath>
    <clipPath id="ra"><rect x="0" y="40" width="500" height="430"/></clipPath>
    <clipPath id="cc"><rect x="0" y="410" width="500" height="60"/></clipPath>
  </defs>

  <!-- Court surface -->
  <rect width="500" height="470" rx="4" fill="#151922"/>

  <!-- ═══════ 9 ZONES ═══════ -->
  <g id="zones">
    <path id="z-paint"     class="zone zone-default" d="M170,0 L330,0 L330,190 L170,190 Z"/>
    <path id="z-mid-l"     class="zone zone-default" d="M30,0 L170,0 L170,276 L160,272 L140,263 L120,251 L100,237 L80,218 L60,195 L30,142 Z"/>
    <path id="z-mid-r"     class="zone zone-default" d="M330,0 L470,0 L470,142 L440,195 L420,218 L400,237 L380,251 L360,263 L340,272 L330,276 L330,0 Z"/>
    <path id="z-mid-top"   class="zone zone-default" d="M170,190 L330,190 L330,276 L320,279 L300,285 L280,288 L260,290 L250,290 L240,290 L220,288 L200,285 L180,279 L170,276 Z"/>
    <path id="z-corner3-l" class="zone zone-default" d="M0,0 L30,0 L30,142 L0,142 Z"/>
    <path id="z-corner3-r" class="zone zone-default" d="M470,0 L500,0 L500,142 L470,142 Z"/>
    <path id="z-wing3-l"   class="zone zone-default" d="M0,142 L30,142 L38,160 L50,180 L64,200 L82,220 L104,240 L135,260 L155,270 L170,276 L170,470 L0,470 Z"/>
    <path id="z-wing3-r"   class="zone zone-default" d="M470,142 L500,142 L500,470 L330,470 L330,276 L345,270 L366,260 L396,240 L418,220 L436,200 L450,180 L462,160 L470,142 Z"/>
    <path id="z-top3"      class="zone zone-default" d="M170,276 L180,279 L200,285 L220,288 L240,290 L250,290 L260,290 L280,288 L300,285 L320,279 L330,276 L330,470 L170,470 Z"/>
  </g>

  <!-- ═══════ COURT LINES ═══════ -->
  <g id="court-lines">
    <rect x="1" y="1" width="498" height="468" rx="3" class="cl"/>
    <rect x="170" y="0" width="160" height="190" class="cl"/>
    <circle cx="250" cy="190" r="60" class="cl" clip-path="url(#ftb)"/>
    <circle cx="250" cy="190" r="60" class="cld" clip-path="url(#ftt)"/>
    <line x1="30" y1="0" x2="30" y2="142" class="cl"/>
    <line x1="470" y1="0" x2="470" y2="142" class="cl"/>
    <circle cx="250" cy="52.5" r="237.5" class="cl" clip-path="url(#c3)"/>
    <circle cx="250" cy="52.5" r="40" class="cl" clip-path="url(#ra)"/>
    <line x1="220" y1="40" x2="280" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="250" cy="52.5" r="7.5" stroke="#ff3a14" stroke-width="2.5"/>
    <circle cx="250" cy="470" r="60" class="cld" clip-path="url(#cc)"/>
  </g>
</svg>
