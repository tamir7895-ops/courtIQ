<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="court4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <rect width="360" height="780" rx="44" fill="url(#bg4)"/>
  <rect x="6" y="6" width="348" height="768" rx="38" fill="none" stroke="#23262e" stroke-width="1"/>

  <!-- Status bar -->
  <text x="28" y="36" fill="#f4ede4" font-size="13" font-weight="600">9:41</text>
  <g transform="translate(298,28)" fill="#f4ede4">
    <rect x="0" y="2" width="14" height="9" rx="1"/>
    <rect x="18" y="2" width="14" height="9" rx="2" fill="none" stroke="#f4ede4" stroke-width="1"/>
    <rect x="20" y="4" width="9" height="5" rx="1"/>
  </g>
  <rect x="120" y="14" width="120" height="30" rx="15" fill="#0a0c10"/>

  <!-- Header -->
  <text x="24" y="80" fill="#e85d04" font-size="9" letter-spacing="2.2" font-family="ui-monospace, monospace">— WEEK 18 / MAY 4 — MAY 10</text>
  <text x="24" y="116" fill="#f4ede4" font-size="30" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">STATS</text>

  <!-- Three rings -->
  <g transform="translate(24 144)">
    <!-- Ring 1: Form -->
    <g transform="translate(48 48)">
      <circle r="40" fill="none" stroke="#f4ede4" stroke-opacity="0.08" stroke-width="6"/>
      <circle r="40" fill="none" stroke="#e85d04" stroke-width="6" stroke-dasharray="186 251.3" stroke-dashoffset="0" transform="rotate(-90)"/>
      <text y="6" text-anchor="middle" fill="#f4ede4" font-size="22" font-weight="800" font-family="'Barlow Condensed', sans-serif">74</text>
    </g>
    <text x="48" y="112" text-anchor="middle" fill="#f4ede4" fill-opacity="0.6" font-size="9" letter-spacing="1.8" font-family="ui-monospace, monospace">FORM</text>
    <!-- Ring 2: Volume -->
    <g transform="translate(156 48)">
      <circle r="40" fill="none" stroke="#f4ede4" stroke-opacity="0.08" stroke-width="6"/>
      <circle r="40" fill="none" stroke="#e85d04" stroke-width="6" stroke-dasharray="153 251.3" transform="rotate(-90)"/>
      <text y="6" text-anchor="middle" fill="#f4ede4" font-size="22" font-weight="800" font-family="'Barlow Condensed', sans-serif">61</text>
    </g>
    <text x="156" y="112" text-anchor="middle" fill="#f4ede4" fill-opacity="0.6" font-size="9" letter-spacing="1.8" font-family="ui-monospace, monospace">VOLUME</text>
    <!-- Ring 3: Streak -->
    <g transform="translate(264 48)">
      <circle r="40" fill="none" stroke="#f4ede4" stroke-opacity="0.08" stroke-width="6"/>
      <circle r="40" fill="none" stroke="#7be37b" stroke-width="6" stroke-dasharray="221 251.3" transform="rotate(-90)"/>
      <text y="6" text-anchor="middle" fill="#f4ede4" font-size="22" font-weight="800" font-family="'Barlow Condensed', sans-serif">88</text>
    </g>
    <text x="264" y="112" text-anchor="middle" fill="#f4ede4" fill-opacity="0.6" font-size="9" letter-spacing="1.8" font-family="ui-monospace, monospace">STREAK</text>
  </g>

  <!-- Big number row -->
  <g transform="translate(24 280)">
    <line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.12"/>
    <text x="0" y="36" fill="#f4ede4" font-size="56" font-weight="800" letter-spacing="-3" font-family="'Barlow Condensed', sans-serif">1,284</text>
    <text x="0" y="58" fill="#f4ede4" fill-opacity="0.5" font-size="9.5" letter-spacing="2" font-family="ui-monospace, monospace">SHOTS THIS WEEK · ↗ +18%</text>
    <text x="312" y="36" text-anchor="end" fill="#e85d04" font-size="56" font-weight="800" letter-spacing="-3" font-family="'Barlow Condensed', sans-serif">62%</text>
    <text x="312" y="58" text-anchor="end" fill="#f4ede4" fill-opacity="0.5" font-size="9.5" letter-spacing="2" font-family="ui-monospace, monospace">FG / PR THIS YEAR</text>
  </g>

  <!-- Daily bars -->
  <g transform="translate(24 364)">
    <line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.12"/>
    <text x="0" y="22" fill="#f4ede4" fill-opacity="0.7" font-size="11" letter-spacing="2" font-family="ui-monospace, monospace">DAILY VOLUME</text>
    <g transform="translate(0 36)">
      <rect x="0" y="40" width="36" height="36" fill="#e85d04" fill-opacity="0.4"/>
      <rect x="44" y="22" width="36" height="54" fill="#e85d04" fill-opacity="0.55"/>
      <rect x="88" y="50" width="36" height="26" fill="#e85d04" fill-opacity="0.3"/>
      <rect x="132" y="0" width="36" height="76" fill="#e85d04"/>
      <rect x="176" y="14" width="36" height="62" fill="#e85d04" fill-opacity="0.7"/>
      <rect x="220" y="30" width="36" height="46" fill="#e85d04" fill-opacity="0.5"/>
      <rect x="264" y="6" width="36" height="70" fill="#e85d04" fill-opacity="0.85"/>
    </g>
    <g transform="translate(0 122)" fill="#f4ede4" fill-opacity="0.4" font-size="9" letter-spacing="1.5" font-family="ui-monospace, monospace">
      <text x="18" text-anchor="middle">M</text>
      <text x="62" text-anchor="middle">T</text>
      <text x="106" text-anchor="middle">W</text>
      <text x="150" text-anchor="middle">T</text>
      <text x="194" text-anchor="middle">F</text>
      <text x="238" text-anchor="middle">S</text>
      <text x="282" text-anchor="middle">S</text>
    </g>
  </g>

  <!-- Court heatmap -->
  <g transform="translate(24 524)">
    <line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.12"/>
    <text x="0" y="22" fill="#f4ede4" fill-opacity="0.7" font-size="11" letter-spacing="2" font-family="ui-monospace, monospace">SPOT HEATMAP — HALF COURT</text>
    <g transform="translate(0 32)">
      <rect width="312" height="160" rx="10" fill="url(#court4)" stroke="#f4ede4" stroke-opacity="0.08"/>
      <!-- Court lines -->
      <g stroke="#f4ede4" stroke-opacity="0.18" fill="none" stroke-width="1.2">
        <line x1="0" y1="160" x2="312" y2="160"/>
        <rect x="116" y="0" width="80" height="60"/>
        <circle cx="156" cy="60" r="22"/>
        <path d="M14 0 Q14 90 156 90 Q298 90 298 0"/>
      </g>
      <!-- Heat dots: bigger = more attempts, color = make % -->
      <circle cx="60" cy="56" r="14" fill="#e85d04" fill-opacity="0.85"/>
      <text x="60" y="60" text-anchor="middle" fill="#0e1014" font-size="10" font-weight="700">71%</text>
      <circle cx="156" cy="38" r="11" fill="#e85d04" fill-opacity="0.55"/>
      <text x="156" y="42" text-anchor="middle" fill="#0e1014" font-size="9" font-weight="700">48%</text>
      <circle cx="252" cy="56" r="14" fill="#7be37b" fill-opacity="0.7"/>
      <text x="252" y="60" text-anchor="middle" fill="#0e1014" font-size="10" font-weight="700">82%</text>
      <circle cx="100" cy="110" r="9" fill="#e85d04" fill-opacity="0.4"/>
      <text x="100" y="114" text-anchor="middle" fill="#0e1014" font-size="8" font-weight="700">38%</text>
      <circle cx="212" cy="110" r="13" fill="#e85d04" fill-opacity="0.7"/>
      <text x="212" y="114" text-anchor="middle" fill="#0e1014" font-size="10" font-weight="700">64%</text>
      <circle cx="156" cy="138" r="16" fill="#7be37b" fill-opacity="0.85"/>
      <text x="156" y="142" text-anchor="middle" fill="#0e1014" font-size="11" font-weight="700">88%</text>
    </g>
  </g>

  <!-- Tab bar -->
  <g transform="translate(24 736)" font-size="9" letter-spacing="2" font-family="ui-monospace, monospace">
    <text x="20" y="0" fill="#f4ede4" fill-opacity="0.5">HOME</text>
    <text x="76" y="0" fill="#f4ede4" fill-opacity="0.5">TRACK</text>
    <text x="138" y="0" fill="#f4ede4" fill-opacity="0.5">DRILLS</text>
    <text x="208" y="0" fill="#e85d04" font-weight="700">STATS</text>
    <text x="270" y="0" fill="#f4ede4" fill-opacity="0.5">COACH</text>
  </g>
</svg>
