<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="pov" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="0.55" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </radialGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0a0c10" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="0" y="0" width="360" height="780" rx="44" fill="url(#bg)"/>
  <rect x="6" y="6" width="348" height="768" rx="38" fill="none" stroke="#23262e" stroke-width="1"/>

  <!-- Status bar -->
  <text x="28" y="36" fill="#f4ede4" font-size="13" font-weight="600">9:41</text>
  <g transform="translate(298,28)" fill="#f4ede4">
    <rect x="0" y="2" width="14" height="9" rx="1"/>
    <rect x="18" y="2" width="14" height="9" rx="2" fill="none" stroke="#f4ede4" stroke-width="1"/>
    <rect x="20" y="4" width="9" height="5" rx="1"/>
  </g>

  <!-- Notch -->
  <rect x="120" y="14" width="120" height="30" rx="15" fill="#0a0c10"/>

  <!-- Header -->
  <text x="24" y="80" fill="#e85d04" font-size="9" letter-spacing="2.2" font-family="ui-monospace, 'SF Mono', monospace">— LIVE / 04:21</text>
  <text x="24" y="116" fill="#f4ede4" font-size="30" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">SHOT TRACKER</text>
  <line x1="24" y1="132" x2="336" y2="132" stroke="#f4ede4" stroke-opacity="0.08"/>

  <!-- Camera POV -->
  <rect x="24" y="148" width="312" height="280" rx="14" fill="url(#pov)"/>
  <rect x="24" y="148" width="312" height="280" rx="14" fill="url(#court)"/>

  <!-- Floor lines -->
  <g stroke="#f4ede4" stroke-opacity="0.18" fill="none" stroke-width="1">
    <path d="M40 410 L320 410"/>
    <path d="M150 410 L60 380"/>
    <path d="M210 410 L300 380"/>
    <path d="M170 410 L160 360"/>
    <path d="M190 410 L200 360"/>
  </g>

  <!-- Backboard + hoop -->
  <g transform="translate(180 200)">
    <rect x="-50" y="-44" width="100" height="48" rx="3" fill="none" stroke="#f4ede4" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="-18" y="-22" width="36" height="20" rx="2" fill="none" stroke="#f4ede4" stroke-opacity="0.7" stroke-width="1.2"/>
    <ellipse cx="0" cy="14" rx="34" ry="6" fill="none" stroke="#e85d04" stroke-width="2.5"/>
    <!-- Net -->
    <g stroke="#f4ede4" stroke-opacity="0.45" stroke-width="0.8" fill="none">
      <path d="M-30 16 L-28 36 L-26 50 L-22 60"/>
      <path d="M-15 18 L-14 38 L-13 52 L-11 62"/>
      <path d="M0 18 L0 40 L0 54 L0 64"/>
      <path d="M15 18 L14 38 L13 52 L11 62"/>
      <path d="M30 16 L28 36 L26 50 L22 60"/>
    </g>
  </g>

  <!-- Detection boxes -->
  <g fill="none" stroke-width="1.8">
    <!-- Hoop detection -->
    <rect x="138" y="180" width="84" height="44" rx="2" stroke="#7be37b"/>
    <text x="138" y="174" fill="#7be37b" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">HOOP · 0.99</text>
    <!-- Ball detection -->
    <rect x="98" y="312" width="36" height="36" rx="2" stroke="#e85d04"/>
    <text x="98" y="306" fill="#e85d04" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">BALL · 0.97</text>
    <!-- Player detection -->
    <rect x="216" y="284" width="74" height="124" rx="2" stroke="#f4ede4" stroke-opacity="0.7"/>
    <text x="216" y="278" fill="#f4ede4" fill-opacity="0.7" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">PLAYER · 0.94</text>
  </g>

  <!-- Ball -->
  <g transform="translate(116 330)">
    <circle r="14" fill="#c34a05"/>
    <path d="M0 -14 L0 14 M-14 0 L14 0" stroke="#0a0a0a" stroke-width="1.4"/>
    <path d="M-12 -7 Q0 -2 12 -7" stroke="#0a0a0a" stroke-width="1.2" fill="none"/>
    <path d="M-12 7 Q0 2 12 7" stroke="#0a0a0a" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Trajectory arc -->
  <path d="M120 332 Q150 230 180 220" stroke="#e85d04" stroke-width="1.4" stroke-dasharray="3 3" fill="none" stroke-opacity="0.7"/>

  <!-- Stat cards -->
  <g transform="translate(24 452)">
    <rect width="312" height="52" rx="10" fill="#f4ede4" fill-opacity="0.04" stroke="#f4ede4" stroke-opacity="0.08"/>
    <text x="20" y="22" fill="#f4ede4" fill-opacity="0.55" font-size="9" letter-spacing="2" font-family="ui-monospace, monospace">MADE / ATTEMPTS</text>
    <text x="20" y="44" fill="#e85d04" font-size="22" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">7 / 10</text>
    <text x="200" y="22" fill="#f4ede4" fill-opacity="0.55" font-size="9" letter-spacing="2" font-family="ui-monospace, monospace">STREAK</text>
    <text x="200" y="44" fill="#7be37b" font-size="22" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">+4</text>
  </g>

  <g transform="translate(24 516)">
    <rect width="312" height="52" rx="10" fill="#f4ede4" fill-opacity="0.04" stroke="#f4ede4" stroke-opacity="0.08"/>
    <text x="20" y="22" fill="#f4ede4" fill-opacity="0.55" font-size="9" letter-spacing="2" font-family="ui-monospace, monospace">FORM SCORE</text>
    <text x="20" y="44" fill="#f4ede4" font-size="22" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">87</text>
    <text x="200" y="22" fill="#f4ede4" fill-opacity="0.55" font-size="9" letter-spacing="2" font-family="ui-monospace, monospace">SHOT ARC</text>
    <text x="200" y="44" fill="#f4ede4" font-size="22" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">46°</text>
  </g>

  <!-- Spot heatmap mini -->
  <g transform="translate(24 580)">
    <rect width="312" height="120" rx="10" fill="#f4ede4" fill-opacity="0.03" stroke="#f4ede4" stroke-opacity="0.08"/>
    <text x="20" y="22" fill="#f4ede4" fill-opacity="0.55" font-size="9" letter-spacing="2" font-family="ui-monospace, monospace">SPOTS / SESSION</text>
    <!-- 5 spots -->
    <g transform="translate(40 60)">
      <circle cx="0" cy="20" r="14" fill="#e85d04" fill-opacity="0.85"/>
      <text x="0" y="24" fill="#0e1014" font-size="11" font-weight="700" text-anchor="middle">3/3</text>
    </g>
    <g transform="translate(96 60)">
      <circle cx="0" cy="0" r="14" fill="#e85d04" fill-opacity="0.7"/>
      <text x="0" y="4" fill="#0e1014" font-size="11" font-weight="700" text-anchor="middle">1/2</text>
    </g>
    <g transform="translate(156 60)">
      <circle cx="0" cy="-12" r="14" fill="#e85d04" fill-opacity="1"/>
      <text x="0" y="-8" fill="#0e1014" font-size="11" font-weight="700" text-anchor="middle">2/2</text>
    </g>
    <g transform="translate(216 60)">
      <circle cx="0" cy="0" r="14" fill="#e85d04" fill-opacity="0.4"/>
      <text x="0" y="4" fill="#f4ede4" font-size="11" font-weight="700" text-anchor="middle">1/2</text>
    </g>
    <g transform="translate(272 60)">
      <circle cx="0" cy="20" r="14" fill="#e85d04" fill-opacity="0.55"/>
      <text x="0" y="24" fill="#0e1014" font-size="11" font-weight="700" text-anchor="middle">0/1</text>
    </g>
  </g>

  <!-- Bottom record button -->
  <g transform="translate(180 730)">
    <circle r="22" fill="none" stroke="#f4ede4" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="14" fill="#e85d04"/>
  </g>
</svg>
