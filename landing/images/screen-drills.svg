  <text x="24" y="116" fill="#f4ede4" font-size="30" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">DRILLS</text>

  <!-- Search bar -->
  <g transform="translate(24 132)">
    <rect width="312" height="38" rx="19" fill="#f4ede4" fill-opacity="0.04" stroke="#f4ede4" stroke-opacity="0.08"/>
    <circle cx="22" cy="19" r="6" fill="none" stroke="#f4ede4" stroke-opacity="0.4" stroke-width="1.4"/>
    <line x1="27" y1="24" x2="32" y2="29" stroke="#f4ede4" stroke-opacity="0.4" stroke-width="1.4"/>
    <text x="42" y="24" fill="#f4ede4" fill-opacity="0.4" font-size="12">Form, spot-up, pull-up…</text>
  </g>

