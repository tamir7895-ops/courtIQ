  <g transform="translate(24 184)" font-size="9" letter-spacing="1.8" font-family="ui-monospace, monospace">
    <g><rect width="60" height="22" rx="11" fill="#e85d04"/><text x="30" y="15" text-anchor="middle" fill="#0e1014" font-weight="700">ALL · 81</text></g>
    <g transform="translate(70 0)"><rect width="68" height="22" rx="11" fill="none" stroke="#f4ede4" stroke-opacity="0.18"/><text x="34" y="15" text-anchor="middle" fill="#f4ede4" fill-opacity="0.65">FORM · 14</text></g>
    <g transform="translate(148 0)"><rect width="74" height="22" rx="11" fill="none" stroke="#f4ede4" stroke-opacity="0.18"/><text x="37" y="15" text-anchor="middle" fill="#f4ede4" fill-opacity="0.65">SPOT-UP · 19</text></g>
    <g transform="translate(232 0)"><rect width="74" height="22" rx="11" fill="none" stroke="#f4ede4" stroke-opacity="0.18"/><text x="37" y="15" text-anchor="middle" fill="#f4ede4" fill-opacity="0.65">PULL-UP · 12</text></g>
