    <g transform="translate(0 192)"><line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.08"/>
      <text x="0" y="22" fill="#f4ede4" font-size="14" font-weight="600">Three-Point Rotation</text>
      <text x="0" y="40" fill="#f4ede4" fill-opacity="0.5" font-size="9.5" letter-spacing="1.5" font-family="ui-monospace, monospace">SPOT-UP · 20 MIN · 50 ATTEMPTS</text>
      <text x="312" y="22" text-anchor="end" fill="#e85d04" font-size="14" font-weight="700">38%</text>
      <text x="312" y="40" text-anchor="end" fill="#f4ede4" fill-opacity="0.4" font-size="9" letter-spacing="1.5" font-family="ui-monospace, monospace">↘ -3</text>
    </g>
    <g transform="translate(0 256)"><line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.08"/>
      <text x="0" y="22" fill="#f4ede4" font-size="14" font-weight="600">Free Throw — Fatigued</text>
      <text x="0" y="40" fill="#f4ede4" fill-opacity="0.5" font-size="9.5" letter-spacing="1.5" font-family="ui-monospace, monospace">CLUTCH · 6 MIN · 25 FTs</text>
      <text x="312" y="22" text-anchor="end" fill="#7be37b" font-size="14" font-weight="700">82%</text>
      <text x="312" y="40" text-anchor="end" fill="#f4ede4" fill-opacity="0.4" font-size="9" letter-spacing="1.5" font-family="ui-monospace, monospace">↗ PR</text>
    </g>
    <g transform="translate(0 320)"><line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.08"/>
      <text x="0" y="22" fill="#f4ede4" font-size="14" font-weight="600">Hostage Dribble Series</text>
      <text x="0" y="40" fill="#f4ede4" fill-opacity="0.5" font-size="9.5" letter-spacing="1.5" font-family="ui-monospace, monospace">HANDLE · 9 MIN · 4 SETS</text>
