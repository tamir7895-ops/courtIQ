    <g transform="translate(0 128)"><line x1="0" y1="0" x2="312" y2="0" stroke="#f4ede4" stroke-opacity="0.08"/>
      <text x="0" y="22" fill="#f4ede4" font-size="14" font-weight="600">Finish Through Contact</text>
      <text x="0" y="40" fill="#f4ede4" fill-opacity="0.5" font-size="9.5" letter-spacing="1.5" font-family="ui-monospace, monospace">FINISHING · 8 MIN · 20 REPS</text>
      <text x="312" y="22" text-anchor="end" fill="#f4ede4" font-size="14" font-weight="700">58%</text>
      <text x="312" y="40" text-anchor="end" fill="#f4ede4" fill-opacity="0.4" font-size="9" letter-spacing="1.5" font-family="ui-monospace, monospace">NEW</text>
