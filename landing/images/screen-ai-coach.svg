<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <rect width="360" height="780" rx="44" fill="url(#bg)"/>
  <rect x="6" y="6" width="348" height="768" rx="38" fill="none" stroke="#23262e" stroke-width="1"/>

  <!-- Status bar -->
  <text x="28" y="36" fill="#f4ede4" font-size="13" font-weight="600">9:41</text>
  <g transform="translate(298,28)" fill="#f4ede4">
    <rect x="0" y="2" width="14" height="9" rx="1"/>
    <rect x="18" y="2" width="14" height="9" rx="2" fill="none" stroke="#f4ede4" stroke-width="1"/>
    <rect x="20" y="4" width="9" height="5" rx="1"/>
  </g>
  <rect x="120" y="14" width="120" height="30" rx="15" fill="#0a0c10"/>

  <!-- Header -->
  <text x="24" y="80" fill="#e85d04" font-size="9" letter-spacing="2.2" font-family="ui-monospace, monospace">— THREAD / TODAY · 14:02</text>
  <text x="24" y="116" fill="#f4ede4" font-size="30" font-weight="800" letter-spacing="-0.5" font-family="'Barlow Condensed', sans-serif">AI COACH</text>

  <!-- Coach avatar + status -->
  <g transform="translate(24 140)">
    <circle cx="14" cy="14" r="14" fill="#e85d04"/>
    <text x="14" y="18" text-anchor="middle" fill="#0e1014" font-weight="800" font-size="11" font-family="'Barlow Condensed', sans-serif">CIQ</text>
    <text x="36" y="13" fill="#f4ede4" font-size="11" font-weight="600">Coach</text>
    <circle cx="40" cy="22" r="3" fill="#7be37b"/>
    <text x="48" y="25" fill="#f4ede4" fill-opacity="0.5" font-size="9" letter-spacing="1.5" font-family="ui-monospace, monospace">ONLINE · 24/7</text>
  </g>

  <line x1="24" y1="180" x2="336" y2="180" stroke="#f4ede4" stroke-opacity="0.08"/>

  <!-- User msg 1 -->
  <g transform="translate(74 200)">
    <text x="262" y="0" text-anchor="end" fill="#f4ede4" fill-opacity="0.4" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">— YOU</text>
    <rect x="0" y="8" width="262" height="44" rx="14" fill="#f4ede4" fill-opacity="0.04" stroke="#f4ede4" stroke-opacity="0.08"/>
    <text x="14" y="30" fill="#f4ede4" font-size="13">My elbow is drifting on pull-ups.</text>
    <text x="14" y="46" fill="#f4ede4" font-size="13">Drill me.</text>
  </g>

  <!-- Coach reply 1 -->
  <g transform="translate(24 264)">
    <text x="0" y="0" fill="#0e1014" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace" fill-opacity="0">.</text>
    <text x="0" y="0" fill="#e85d04" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">— COACH</text>
    <rect x="0" y="8" width="280" height="118" rx="14" fill="#e85d04"/>
    <text x="14" y="30" fill="#0e1014" font-size="12.5" font-weight="500">Yesterday's tape: 3 of 6 missed</text>
    <text x="14" y="46" fill="#0e1014" font-size="12.5" font-weight="500">long. Elbow flared past 12° on</text>
    <text x="14" y="62" fill="#0e1014" font-size="12.5" font-weight="500">every miss.</text>
    <text x="14" y="86" fill="#0e1014" font-size="12.5" font-weight="600">Run "Elbow Tuck — 5 spots".</text>
    <text x="14" y="102" fill="#0e1014" font-size="12.5" font-weight="500">Phone beeps if elbow flares.</text>
    <text x="14" y="118" fill="#0e1014" font-size="12.5" font-weight="700">8 minutes. Now.</text>
  </g>

  <!-- Inline drill card from coach -->
  <g transform="translate(24 396)">
    <rect width="280" height="68" rx="12" fill="#0e1014" stroke="#e85d04"/>
    <text x="14" y="22" fill="#e85d04" font-size="8" letter-spacing="2" font-family="ui-monospace, monospace">— SUGGESTED DRILL</text>
    <text x="14" y="44" fill="#f4ede4" font-size="16" font-weight="700" font-family="'Barlow Condensed', sans-serif">ELBOW TUCK · 5 SPOTS</text>
    <text x="14" y="60" fill="#f4ede4" fill-opacity="0.55" font-size="10" font-family="ui-monospace, monospace">8 MIN · 25 ATTEMPTS · LIVE FORM CUE</text>
    <text x="252" y="44" fill="#e85d04" font-size="22" font-weight="800" font-family="'Barlow Condensed', sans-serif">→</text>
  </g>

  <!-- User msg 2 -->
  <g transform="translate(150 488)">
    <text x="186" y="0" text-anchor="end" fill="#f4ede4" fill-opacity="0.4" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">— YOU</text>
    <rect x="0" y="8" width="186" height="36" rx="14" fill="#f4ede4" fill-opacity="0.04" stroke="#f4ede4" stroke-opacity="0.08"/>
    <text x="14" y="30" fill="#f4ede4" font-size="13">Compare to last Sunday?</text>
  </g>

  <!-- Coach reply 2: sparkline -->
  <g transform="translate(24 540)">
    <text x="0" y="0" fill="#e85d04" font-size="8" letter-spacing="1.5" font-family="ui-monospace, monospace">— COACH</text>
    <rect x="0" y="8" width="280" height="116" rx="14" fill="#e85d04"/>
    <text x="14" y="30" fill="#0e1014" font-size="12" font-weight="500">Last 7 sessions, pull-up FG%:</text>
    <!-- Mini chart -->
    <g transform="translate(14 44)" stroke="#0e1014" fill="none" stroke-width="1.6">
      <path d="M0 32 L36 28 L72 36 L108 22 L144 26 L180 14 L216 18 L252 6"/>
      <g fill="#0e1014">
        <circle cx="0" cy="32" r="2"/>
        <circle cx="36" cy="28" r="2"/>
        <circle cx="72" cy="36" r="2"/>
        <circle cx="108" cy="22" r="2"/>
        <circle cx="144" cy="26" r="2"/>
        <circle cx="180" cy="14" r="2"/>
        <circle cx="216" cy="18" r="2"/>
        <circle cx="252" cy="6" r="3"/>
      </g>
    </g>
    <text x="14" y="98" fill="#0e1014" font-size="11" font-weight="700">+9.2 pts since Sun · trending up</text>
  </g>

  <!-- Input bar -->
  <g transform="translate(24 686)">
    <rect width="280" height="40" rx="20" fill="#f4ede4" fill-opacity="0.04" stroke="#f4ede4" stroke-opacity="0.10"/>
    <text x="20" y="25" fill="#f4ede4" fill-opacity="0.4" font-size="12">Ask anything…</text>
    <circle cx="312" cy="20" r="20" fill="#e85d04"/>
    <text x="312" y="25" text-anchor="middle" fill="#0e1014" font-size="14" font-weight="800">↑</text>
  </g>
</svg>
