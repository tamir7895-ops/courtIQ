<!doctype html>
<html lang="en" style="background:#FBF5E8">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#FBF5E8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>CourtIQ</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

<!-- v10 design system (cache-bust via ?v=) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" rel="stylesheet">
<link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css?v=2026-07-09-d4" />
<link rel="stylesheet" href="styles/components.css?v=2026-07-09-d4" />

<!-- Engine: legacy ShotTrackingScreen overlay styling -->
<link rel="stylesheet" href="/features/shot-tracking/shot-tracking.css?v=2026-07-09-d4" />
</head>
<body>

<main id="app" role="main"></main>

<!-- ─── Preview-mode flag (skip auth redirects when no session) ─── -->
<script>
  window.__PREVIEW_MODE__ = true;   // assume preview until session confirmed
</script>

<!-- ─── Engine: 3rd-party CDNs ─── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js" crossorigin="anonymous"></script>

<!-- ─── Engine: CourtIQ data + auth services ─── -->
<script src="/js/utils.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/data-service.js"></script>
<script src="/js/ai-coach.js"></script>
<script src="/js/drill-engine.js"></script>
<script src="/js/gamification.js"></script>
<script src="/js/streak.js"></script>
<script src="/js/badges.js"></script>
<script src="/js/avatar-shop.js"></script>
<script src="/js/avatar-customizer.js"></script>
<script src="/js/daily-challenge.js"></script>
<script src="/js/daily-workout.js"></script>
<script src="/js/shot-analysis.js"></script>

<!-- MediaPipe Tasks Vision (Pose Landmarker for shooting-motion detection) -->
<script type="module">
  import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';
  window.__MP = { PoseLandmarker: PoseLandmarker, FilesetResolver: FilesetResolver };
</script>

<!-- ─── Engine: shot tracking pipeline (YOLO + Pose) ─── -->
<script src="/features/shot-tracking/v2/config.js?v=2026-07-09-d4"></script>
<script src="/features/shot-tracking/adaptiveLearning.js?v=2026-07-09-d4"></script>
<script src="/features/shot-tracking/poseDetector.js?v=2026-07-09-d4"></script>
<script src="/features/shot-tracking/shotDetection.js?v=2026-07-09-d4"></script>
<script src="/features/shot-tracking/offlineProcessor.js?v=2026-07-09-d4"></script>
<script src="/features/shot-tracking/shotService.js?v=2026-07-09-d4"></script>
<script src="/features/shot-tracking/ShotTrackingScreen.js?v=2026-07-09-d4"></script>

<!-- ─── Session bootstrap: get real Supabase user if available ─── -->
<script>
  (function () {
    if (typeof sb === 'undefined' || !sb || !sb.auth || !sb.auth.getSession) return;
    sb.auth.getSession().then(function (res) {
      if (res && res.data && res.data.session) {
        window.currentUser = res.data.session.user;
        window.__PREVIEW_MODE__ = false;
        console.info('[v10] signed-in user:', window.currentUser.email);
      } else {
        console.info('[v10] no session — preview mode');
      }
    }).catch(function (e) { console.warn('[v10] getSession failed:', e); });
  })();
</script>

<!-- ─── v10 lib (foundation) ─── -->
<script src="lib/ui.js?v=2026-07-09-d4"></script>
<script src="lib/data.js?v=2026-07-09-d4"></script>
<script src="lib/nav.js?v=2026-07-09-d4"></script>
<script src="app.js?v=2026-07-09-d4"></script>

<!-- ─── Screens (each calls window.app.register on load) ─── -->
<script src="screens/home.js?v=2026-07-09-d4"></script>
<script src="screens/track.js?v=2026-07-09-d4"></script>
<script src="screens/train.js?v=2026-07-09-d4"></script>
<script src="screens/coach.js?v=2026-07-09-d4"></script>
<script src="screens/me.js?v=2026-07-09-d4"></script>
<script src="screens/camera-hud.js?v=2026-07-09-d4"></script>
<script src="screens/post-session.js?v=2026-07-09-d4"></script>
<script src="screens/onboarding.js?v=2026-07-09-d4"></script>
<script src="screens/drill-library.js?v=2026-07-09-d4"></script>
<script src="screens/workout-player.js?v=2026-07-09-d4"></script>
<script src="screens/avatar-customizer.js?v=2026-07-09-d4"></script>
<script src="screens/notifications.js?v=2026-07-09-d4"></script>

<script>
  // Bootstrap after all scripts load
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { window.app && window.app.bootstrap(); }, 50);
  });
</script>

</body>
</html>
