<!-- Boot splash: the brand mark with the ball circling the fingertip.
     Pure CSS (0 bytes of network), removed with a fade the moment the
     first screen composes. A Higgsfield video version can replace the
     ring later — same slot, heavier asset. -->
<div id="boot-splash" aria-hidden="true">
  <div class="bs-wrap">
    <!-- FINGER SPIN, like the reference video: the ball spins about the
         VERTICAL axis on the fingertip. The sphere and its lighting stay
         still; the seam lines wrap around it horizontally — that is what
         sells rotation-about-Y — plus the small balance wobble. -->
    <svg class="bs-ball" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="bsG" cx="35%" cy="28%" r="90%">
          <stop offset="0" stop-color="#FF8F45"/>
          <stop offset=".6" stop-color="#E8590C"/>
          <stop offset="1" stop-color="#B23F05"/>
        </radialGradient>
        <clipPath id="bsClip"><circle cx="50" cy="50" r="46"/></clipPath>
      </defs>
      <g class="bs-wobble">
        <circle cx="50" cy="50" r="46" fill="url(#bsG)"/>
        <g clip-path="url(#bsClip)">
          <!-- equator: fixed, it doesn't move when spinning about Y -->
          <path d="M4 50 q46 12 92 0" fill="none" stroke="#7A2E08" stroke-width="3" opacity=".8"/>
          <!-- longitudes: march sideways = the spin. Pattern repeats every 46px -->
          <g class="bs-seams" fill="none" stroke="#7A2E08" stroke-width="3" opacity=".8">
            <path d="M4 50 q23 -46 46 0 q23 46 46 0" transform="translate(-46 0)"/>
            <path d="M27 4 q0 46 0 92" transform="translate(-46 0)"/>
            <path d="M4 50 q23 -46 46 0 q23 46 46 0"/>
            <path d="M27 4 q0 46 0 92"/>
            <path d="M4 50 q23 -46 46 0 q23 46 46 0" transform="translate(46 0)"/>
            <path d="M27 4 q0 46 0 92" transform="translate(46 0)"/>
          </g>
        </g>
        <circle cx="50" cy="50" r="46" fill="none" stroke="#8a3a0c" stroke-width="2.5"/>
      </g>
    </svg>
    <div class="bs-tip"></div>
  </div>
</div>
<style>
  #boot-splash {
    position: fixed; inset: 0; z-index: 9999; background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .35s ease;
  }
  #boot-splash.is-done { opacity: 0; pointer-events: none; }
  .bs-wrap { position: relative; width: 96px; height: 118px; text-align: center; }
  .bs-ball { width: 84px; height: 84px; margin: 0 auto; display: block; }
  .bs-seams { animation: bs-wrap 0.55s linear infinite; }
  @keyframes bs-wrap { to { transform: translateX(46px); } }
  .bs-wobble {
    transform-origin: 50px 96px;              /* pivots on the fingertip */
    animation: bs-wobble 1.4s ease-in-out infinite;
  }
  @keyframes bs-wobble {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(3.5deg); }
  }
  /* the fingertip the ball spins on */
  .bs-tip {
    width: 12px; height: 18px; margin: 2px auto 0;
    border-radius: 7px 7px 9px 9px; background: #0A2850;
  }
  @media (prefers-reduced-motion: reduce) { .bs-seams, .bs-wobble { animation: none; } }
</style>

<!-- ג”€ג”€ג”€ Engine: 3rd-party CDNs ג”€ג”€ג”€ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<!-- A10: ONNX Runtime is served from the APP BUNDLE, not a CDN. The native
     (Capacitor) app already ships the YOLOX model locally, but the engine that
     runs it was still fetched from jsdelivr — so shot tracking could not load
     at all without internet (exactly the outdoor-court case) and was hostage to
     a CDN outage. Vendored at /vendor/ort (copied into www/ by build.js).
     wasmPaths must point at the same folder or ORT re-fetches the .wasm/.mjs
     from the CDN default. The CDN <script> stays only as a last-resort fallback
     if the local file is somehow missing from the bundle. -->
<script src="../vendor/ort/ort.webgpu.min.js"></script>
<script>
  if (!window.ort) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js" crossorigin="anonymous"><\/script>');
  }
</script>
<script>
  // The WebGPU (jsep) backend dynamically import()s an .mjs sidecar, and a
  // dynamic import is REJECTED unless the response has a JavaScript MIME type.
  // Capacitor's iOS WebViewAssetHandler has NO ".mjs" entry in its MIME table
  // (Android does) — it would serve application/octet-stream and ORT would die
  // with "Failed to fetch dynamically imported module", i.e. no shot detection
  // at all on iOS. So the sidecar ships with a .js extension ("js" IS mapped on
  // both platforms) and we point ORT straight at it. .wasm is mapped on both.
  try {
    if (window.ort && ort.env && ort.env.wasm) {
      // ROOT-ABSOLUTE, not page-relative: ORT resolves wasmPaths.wasm/mjs
      // relative to ort.webgpu.min.js's OWN script location (/vendor/ort/),
      // not the page's URL. A page-relative '../vendor/ort/...' string
      // doubled into '/vendor/vendor/ort/...' from there — 404, WebGPU
      // dies, wasm-proxy/wasm-main-thread cascade-fail on the poisoned
      // initWasm() singleton, and the engine silently drops to color-only
      // (zero ML detection) in production. Confirmed via the shipped
      // www/ build in a real browser tab, not just the isolated verify
      // page — the isolated page used root-absolute paths already and
      // never exercised this bug. www/ is the Capacitor webDir root on
      // both iOS/Android, so '/vendor/...' is valid there too.
      ort.env.wasm.wasmPaths = {
        wasm: '/vendor/ort/ort-wasm-simd-threaded.jsep.wasm',
        mjs:  '/vendor/ort/ort-wasm-simd-threaded.jsep.mjs.js'
      };
    }
  } catch (e) { /* ORT resolves its own default if this fails */ }
</script>

<!-- Session recording. ShotTrackingScreen calls VideoReview.startRecording()
     on the camera stream and stopRecording() at the end, but this file was
     never included here — so window.VideoReview was undefined in the v10 app
     and NOTHING was ever recorded. Without it the record-then-analyse flow
     has no clip to analyse at all. -->
<script src="../js/video-review.js"></script>

<!-- MediaPipe Tasks Vision (Pose Landmarker for shooting-motion detection).
     Served from the APP BUNDLE like ORT above — pose fired most shot triggers
     on eval footage, so it must work offline too. The bundle ships as .mjs.js
     (not .mjs) for the same Capacitor-iOS MIME reason as the ORT sidecar.
     CDN import kept only as a fallback if the local file is missing. -->
<script type="module">
  var mod;
  try {
    mod = await import('../vendor/mediapipe/vision_bundle.mjs.js');
  } catch (e) {
    console.warn('[MP] local bundle failed (' + e.message + ') — falling back to CDN');
    mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
  }
  window.__MP = { PoseLandmarker: mod.PoseLandmarker, FilesetResolver: mod.FilesetResolver };
</script>

<!-- ג”€ג”€ג”€ Session bootstrap: get real Supabase user if available ג”€ג”€ג”€ -->
<script>
  (function () {
    if (typeof sb === 'undefined' || !sb || !sb.auth || !sb.auth.getSession) return;
    sb.auth.getSession().then(function (res) {
      if (res && res.data && res.data.session) {
        window.currentUser = res.data.session.user;
        window.__PREVIEW_MODE__ = false;
        console.info('[v10] signed-in user:', window.currentUser.email);
      } else {
        console.info('[v10] no session ג€” preview mode');
      }
    }).catch(function (e) { console.warn('[v10] getSession failed:', e); });
  })();
</script>

<!-- Design Studio — dev surface only. Loads on localhost, or anywhere with
     ?studio in the URL so it can be opened on a real phone against a LAN
     dev server. Never ships to a production build. -->
<script>
  (function () {
    /* NEVER inside the native app: Capacitor's webview origin is
       capacitor://localhost (iOS) / https://localhost (Android), so a
       plain hostname check would ship the dev Studio to every phone.
       Caught before it ever reached a build; the guard stays first. */
    if (window.Capacitor) return;
    var host = location.hostname;
    var dev = host === 'localhost' || host === '127.0.0.1' ||
              /^192\.168\./.test(host) || /^10\./.test(host) ||
              location.search.indexOf('studio') >= 0;
    if (!dev) return;
    var s = document.createElement('script');
    s.src = 'lib/studio.js?v=bb8817e';
    document.head.appendChild(s);
  })();
</script>

<script>
  // Bootstrap after all scripts load
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (window.app) window.app.bootstrap();
      /* first frame after the first screen composes: fade the splash */
      requestAnimationFrame(function () {
        setTimeout(function () {
          var sp = document.getElementById('boot-splash');
          if (!sp) return;
          sp.classList.add('is-done');
          setTimeout(function () { sp.remove(); }, 400);
        }, 250);
      });
    }, 50);
  });
</script>
