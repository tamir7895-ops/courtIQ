<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Track</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
</head>
<body>
<main class="v5-screen v5-screen--track">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Track · Last 7 Days</div>
      <h1 class="v5-title">Where You Score</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Profile">
      <div class="v5-avatar" style="--xp: 270deg;">
        <div class="v5-avatar__ring"></div>
        <div class="v5-avatar__inner">A</div>
      </div>
      <div class="v5-avatar__lv">LV 14</div>
    </a>
  </header>

  <section class="v5-hero" style="padding: 18px 14px 22px;">
    <svg width="100%" viewBox="0 0 280 220" aria-hidden="true" style="display: block;">
      <rect x="90" y="0" width="100" height="80" stroke="rgba(86,211,100,0.4)" stroke-width="1.2" fill="rgba(86,211,100,0.04)"/>
      <circle cx="140" cy="80" r="28" stroke="rgba(86,211,100,0.4)" stroke-width="1.2" fill="none"/>
      <line x1="140" y1="78" x2="140" y2="82" stroke="var(--c-track)" stroke-width="3"/>
      <path d="M 10,80 Q 10,220 140,220 Q 270,220 270,80" stroke="rgba(86,211,100,0.4)" stroke-width="1.2" fill="none"/>
      <circle cx="60" cy="100" r="7" fill="var(--c-track)"/><text x="60" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#0e1014">6</text>
      <circle cx="140" cy="80" r="10" fill="var(--c-track)"/><text x="140" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#0e1014">12</text>
      <circle cx="200" cy="100" r="6" fill="var(--c-track)"/><text x="200" y="104" text-anchor="middle" font-size="8" font-weight="700" fill="#0e1014">4</text>
      <circle cx="50" cy="160" r="7" fill="rgba(86,211,100,0.5)"/><text x="50" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#0e1014">7</text>
      <circle cx="200" cy="170" r="6" fill="rgba(86,211,100,0.5)"/><text x="200" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#0e1014">5</text>
      <circle cx="140" cy="200" r="9" fill="var(--c-track)"/><text x="140" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#0e1014">9</text>
    </svg>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Paint</div>
      <div class="v5-stat__num v5-stat__num--accent">68<em>%</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Mid</div>
      <div class="v5-stat__num">51<em>%</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">3PT</div>
      <div class="v5-stat__num">42<em>%</em></div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--track">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Last Session · Yesterday</div>
      <div class="v5-card__title">Shooting Drill · 73%</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="#" class="v5-cta">Track New Session <span class="v5-cta__arrow">→</span></a>

</main>

  <a href="train.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span><span class="v5-nav-item__lbl">Train</span></a>
  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</html>
