<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Me</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
</head>
<body>
<main class="v5-screen v5-screen--me">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Me · Player Profile</div>
      <h1 class="v5-title">Alex Rivera</h1>
    </div>
    <a href="#" class="v5-avatar-wrap" aria-label="Settings">
      <div class="v5-avatar">
        <div class="v5-avatar__inner" style="background: rgba(255,255,255,0.06); color: var(--c-text-secondary); font-size: 14px;">⚙</div>
      </div>
      <div class="v5-avatar__lv" style="color: var(--c-text-tertiary);">Settings</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-hero__eyebrow">Level 14 · Sniper</div>
    <div class="v5-hero__ring-wrap" style="margin-top: 4px;">
      <svg width="160" height="160" viewBox="0 0 160 160" aria-hidden="true">
        <circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
        <circle cx="80" cy="80" r="68" fill="none" stroke="var(--c-me)" stroke-width="7" stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="106" transform="rotate(-90 80 80)"/>
      </svg>
      <div class="v5-hero__metric">
        <div style="width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #2a3142, #1a1f2c); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 42px; font-weight: 900; color: var(--c-me); border: 2px solid var(--c-bg);">A</div>
      </div>
    </div>
    <div style="margin-top: 16px;">
      <div style="font-family: var(--font-display); font-size: 28px; font-weight: 900; color: var(--c-white); line-height: 1; text-transform: uppercase;">11,200 <span style="color: var(--c-text-tertiary); font-size: 16px;">/ 15,000 XP</span></div>
      <div class="v5-hero__sub" style="margin-top: 6px;">3,800 XP to Level 15 · Marksman</div>
    </div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Sessions</div>
      <div class="v5-stat__num">47</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Badges</div>
      <div class="v5-stat__num v5-stat__num--accent">12</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Rank</div>
      <div class="v5-stat__num">#42</div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--me">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Avatar · Customize</div>
      <div class="v5-card__title">Jersey, Gear, Accessories</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="#" class="v5-cta">View Achievements <span class="v5-cta__arrow">→</span></a>

</main>

<nav class="v5-bottom-nav">

  <a href="track.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="v5-nav-item__lbl">Track</span></a>

  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item is-active"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</body>
</html>
