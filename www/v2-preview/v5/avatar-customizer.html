<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Avatar Customizer</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
<style>
  .v5-screen--avatar { --accent: var(--c-me); }
  .v5-big-avatar {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a3142, #1a1f2c);
    border: 3px solid var(--c-me);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 900;
    color: var(--c-me);
    margin: 4px auto 0;
    position: relative;
    box-shadow: 0 0 0 8px color-mix(in srgb, var(--c-me) 8%, transparent);
  }
  .v5-big-avatar__jersey {
    position: absolute;
    bottom: -10px;
    right: -10px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--c-me);
    color: var(--c-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 900;
    border: 3px solid var(--c-bg);
  }
</style>
</head>
<body>
<main class="v5-screen v5-screen--avatar">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Me · Avatar</div>
      <h1 class="v5-title">Make It Yours</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Back">
      <div class="v5-avatar">
        <div class="v5-avatar__inner" style="background: rgba(255,255,255,0.06); color: var(--c-text-secondary); font-size: 14px;">‹</div>
      </div>
      <div class="v5-avatar__lv" style="color: var(--c-text-tertiary);">Back</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-hero__eyebrow">Preview · Level 14 · Sniper</div>
    <div class="v5-big-avatar">
      A
      <span class="v5-big-avatar__jersey">23</span>
    </div>
    <div style="font-size: 12px; color: var(--c-text-tertiary); letter-spacing: 0.06em; margin-top: 16px;">3 unsaved changes</div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Jersey #</div>
      <div class="v5-stat__num v5-stat__num--accent">23</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Skin</div>
      <div class="v5-stat__num">III</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Gear</div>
      <div class="v5-stat__num">7<em> / 24</em></div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--me">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Shop · 14 new items</div>
      <div class="v5-card__title">Browse Shop</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="me.html" class="v5-cta">Save Changes <span class="v5-cta__arrow">→</span></a>

</main>

<nav class="v5-bottom-nav">
  <a href="home.html"  class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg></span><span class="v5-nav-item__lbl">Home</span></a>
  <a href="track.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="v5-nav-item__lbl">Track</span></a>
  <a href="train.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span><span class="v5-nav-item__lbl">Train</span></a>
  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item is-active"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</body>
</html>
