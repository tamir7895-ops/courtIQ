<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Coach</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
</head>
<body>
<main class="v5-screen v5-screen--coach">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Coach · Today's Verdict</div>
      <h1 class="v5-title">Read the Room</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Profile">
      <div class="v5-avatar" style="--xp: 270deg;">
        <div class="v5-avatar__ring"></div>
        <div class="v5-avatar__inner">A</div>
      </div>
      <div class="v5-avatar__lv">LV 14</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-hero__eyebrow">Verdict · 3 sessions analyzed</div>
    <div class="v5-hero__big-headline">
      Your <em>left wing</em> is leaking.<br/>
      Spend 50 reps there <em>today</em>.
    </div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Trend</div>
      <div class="v5-stat__num v5-stat__num--accent">+6<em>%</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Hot</div>
      <div class="v5-stat__num">Right<em></em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Cold</div>
      <div class="v5-stat__num">Left<em></em></div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--coach">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Drill · Recommended</div>
      <div class="v5-card__title">Left-Wing Form · 50 reps</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="#" class="v5-cta">Read Full Briefing <span class="v5-cta__arrow">→</span></a>

</main>
