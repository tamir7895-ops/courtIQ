<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Workout Player</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
<style>
  .v5-screen--workout { --accent: var(--c-train); }
  .v5-timer {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    color: var(--c-train);
    font-feature-settings: "tnum" 1;
    text-align: center;
  }
  .v5-progress {
    height: 6px;
    width: 100%;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 14px;
  }
  .v5-progress__fill {
    height: 100%;
    width: 36%;
    background: var(--c-train);
    border-radius: 999px;
  }
</style>
</head>
<body>
<main class="v5-screen v5-screen--workout">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Workout · Drill 2 of 5</div>
      <h1 class="v5-title">Form Shooting</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Profile">
      <div class="v5-avatar" style="--xp: 270deg;">
        <div class="v5-avatar__ring"></div>
        <div class="v5-avatar__inner">A</div>
      </div>
      <div class="v5-avatar__lv">LV 14</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-hero__eyebrow">Time Remaining</div>
    <div class="v5-timer">02:34</div>
    <div style="font-size: 12px; color: var(--c-text-tertiary); letter-spacing: 0.06em; margin-top: 12px;">Left Wing · 50 reps target</div>
    <div class="v5-progress"><div class="v5-progress__fill"></div></div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Rep</div>
      <div class="v5-stat__num v5-stat__num--accent">18<em> / 50</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Drill</div>
      <div class="v5-stat__num">2<em> / 5</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">FG %</div>
      <div class="v5-stat__num">72<em>%</em></div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--train">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Next · Drill 3 of 5</div>
      <div class="v5-card__title">Skip to Catch-and-Shoot</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="#" class="v5-cta">Pause Workout <span class="v5-cta__arrow">⏸</span></a>

</main>

<nav class="v5-bottom-nav">
  <a href="home.html"  class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg></span><span class="v5-nav-item__lbl">Home</span></a>
  <a href="track.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="v5-nav-item__lbl">Track</span></a>
  <a href="train.html" class="v5-nav-item is-active"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span><span class="v5-nav-item__lbl">Train</span></a>
  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</body>
</html>
