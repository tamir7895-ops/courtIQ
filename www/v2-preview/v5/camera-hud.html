<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Camera HUD</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
<style>
  .v5-screen--camera { --accent: var(--c-track); }
  .v5-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--c-track) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--c-track) 38%, transparent);
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--c-track);
    margin-bottom: 12px;
  }
  .v5-pill__dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--c-track);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-track) 30%, transparent);
    animation: v5-pulse 1.4s ease-in-out infinite;
  }
  @keyframes v5-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .v5-cta--danger {
    background: #e85d5d;
    color: var(--c-white);
  }
</style>
</head>
<body>
<main class="v5-screen v5-screen--camera">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Live · 02:14 elapsed</div>
      <h1 class="v5-title">Session in Progress</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Profile">
      <div class="v5-avatar" style="--xp: 270deg;">
        <div class="v5-avatar__ring"></div>
        <div class="v5-avatar__inner">A</div>
      </div>
      <div class="v5-avatar__lv">LV 14</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-pill"><span class="v5-pill__dot"></span>Rim Locked</div>
    <div class="v5-hero__eyebrow">Made / Attempted</div>
    <div class="v5-hero__big-headline" style="padding: 4px 0 6px;">
      12<em> / 15</em> · <em>80%</em>
    </div>
    <div style="font-size: 12px; color: var(--c-text-tertiary); letter-spacing: 0.06em;">Camera locked · YOLOX active</div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Paint</div>
      <div class="v5-stat__num v5-stat__num--accent">5<em> / 5</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Mid</div>
      <div class="v5-stat__num">4<em> / 6</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">3PT</div>
      <div class="v5-stat__num">3<em> / 4</em></div>
    </div>
  </div>

  <a href="post-session.html" class="v5-card v5-card--track">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Last Shot · 0.2s ago</div>
      <div class="v5-card__title">MADE · Right Wing 3PT</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="post-session.html" class="v5-cta v5-cta--danger">End Session <span class="v5-cta__arrow">→</span></a>

</main>

<nav class="v5-bottom-nav">
  <a href="home.html"  class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg></span><span class="v5-nav-item__lbl">Home</span></a>
  <a href="track.html" class="v5-nav-item is-active"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="v5-nav-item__lbl">Track</span></a>
  <a href="train.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span><span class="v5-nav-item__lbl">Train</span></a>
  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</body>
</html>
