<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Drill Library</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
<style>
  .v5-screen--drill { --accent: var(--c-train); }
  .v5-thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, rgba(76,163,255,0.18), rgba(76,163,255,0.04));
    border: 1px solid color-mix(in srgb, var(--c-train) 24%, transparent);
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .v5-thumb__icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--c-train) 20%, transparent);
    border: 2px solid var(--c-train);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--c-train);
    font-size: 22px;
    font-family: var(--font-display);
    font-weight: 900;
  }
  .v5-thumb__tag {
    position: absolute;
    top: 10px; left: 12px;
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--c-train);
    background: rgba(14,16,20,0.7);
    padding: 4px 8px;
    border-radius: 999px;
  }
</style>
</head>
<body>
<main class="v5-screen v5-screen--drill">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Train · Drill Library</div>
      <h1 class="v5-title">Pick Your Reps</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Profile">
      <div class="v5-avatar" style="--xp: 270deg;">
        <div class="v5-avatar__ring"></div>
        <div class="v5-avatar__inner">A</div>
      </div>
      <div class="v5-avatar__lv">LV 14</div>
    </a>
  </header>

  <section class="v5-hero" style="padding: 18px 16px 18px;">
    <div class="v5-thumb">
      <span class="v5-thumb__tag">Featured</span>
      <div class="v5-thumb__icon">▶</div>
    </div>
    <div class="v5-hero__eyebrow">Featured · 50 reps · 8 min</div>
    <div class="v5-hero__big-headline" style="padding: 4px 0 0; font-size: 26px;">
      Left-Wing <em>Form Shooting</em>
    </div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Shooting</div>
      <div class="v5-stat__num v5-stat__num--accent">18</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Handle</div>
      <div class="v5-stat__num">14</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Defense</div>
      <div class="v5-stat__num">10</div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--train">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Custom · Tailored</div>
      <div class="v5-card__title">Build Custom Plan</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="workout-player.html" class="v5-cta">Start Featured Drill <span class="v5-cta__arrow">→</span></a>

</main>

<nav class="v5-bottom-nav">
  <a href="home.html"  class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg></span><span class="v5-nav-item__lbl">Home</span></a>
  <a href="track.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="v5-nav-item__lbl">Track</span></a>
  <a href="train.html" class="v5-nav-item is-active"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span><span class="v5-nav-item__lbl">Train</span></a>
  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</body>
</html>
