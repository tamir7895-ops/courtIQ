<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Train</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
</head>
<body>
<main class="v5-screen v5-screen--train">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Train · Today's Workout</div>
      <h1 class="v5-title">Up Next</h1>
    </div>
    <a href="me.html" class="v5-avatar-wrap" aria-label="Profile">
      <div class="v5-avatar" style="--xp: 270deg;">
        <div class="v5-avatar__ring"></div>
        <div class="v5-avatar__inner">A</div>
      </div>
      <div class="v5-avatar__lv">LV 14</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-hero__eyebrow">Drill 1 of 5 · 50 reps</div>
    <div class="v5-hero__big-headline">
      Form Shooting<br/>
      <em>Left Wing</em>
    </div>
    <div style="font-size: 12px; color: var(--c-text-tertiary); letter-spacing: 0.06em; margin-top: 8px;">Est. 8 min · Light intensity</div>
  </section>

  <div class="v5-stats">
    <div class="v5-stat">
      <div class="v5-stat__lbl">Drills</div>
      <div class="v5-stat__num">1<em> / 5</em></div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">This Week</div>
      <div class="v5-stat__num v5-stat__num--accent">12</div>
    </div>
    <div class="v5-stat">
      <div class="v5-stat__lbl">Streak</div>
      <div class="v5-stat__num">7</div>
    </div>
  </div>

  <a href="#" class="v5-card v5-card--train">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Drill Library · 42 drills</div>
      <div class="v5-card__title">Build a Custom Plan</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="#" class="v5-cta">Start Workout <span class="v5-cta__arrow">→</span></a>

</main>

  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>

</html>
