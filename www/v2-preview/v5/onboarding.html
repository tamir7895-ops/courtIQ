<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ · Onboarding</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="v5.css" />
<style>
  .v5-screen--onb { --accent: var(--c-amber); }
  .v5-step-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 12px;
  }
  .v5-step-dot {
    width: 22px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
  }
  .v5-step-dot.is-done { background: color-mix(in srgb, var(--c-amber) 50%, transparent); }
  .v5-step-dot.is-active { background: var(--c-amber); }
  .v5-pos-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .v5-pos-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--r-md);
    padding: 14px 4px 10px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: border-color var(--duration-fast), background var(--duration-fast);
  }
  .v5-pos-btn:hover { background: rgba(255,255,255,0.07); }
  .v5-pos-btn.is-active {
    background: color-mix(in srgb, var(--c-amber) 10%, transparent);
    border-color: color-mix(in srgb, var(--c-amber) 40%, transparent);
  }
  .v5-pos-btn__num {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    color: var(--c-white);
    line-height: 1;
  }
  .v5-pos-btn.is-active .v5-pos-btn__num { color: var(--c-amber); }
  .v5-pos-btn__lbl {
    font-family: var(--font-display);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: var(--c-text-tertiary);
    text-transform: uppercase;
    margin-top: 6px;
  }
</style>
</head>
<body>
<main class="v5-screen v5-screen--onb">

  <header class="v5-header">
    <div class="v5-header__l">
      <div class="v5-eyebrow">Onboarding · Step 3 of 7</div>
      <h1 class="v5-title">Welcome to CourtIQ</h1>
    </div>
    <a href="home.html" class="v5-avatar-wrap" aria-label="Skip">
      <div class="v5-avatar">
        <div class="v5-avatar__inner" style="background: rgba(255,255,255,0.06); color: var(--c-text-secondary); font-size: 13px;">×</div>
      </div>
      <div class="v5-avatar__lv" style="color: var(--c-text-tertiary);">Skip</div>
    </a>
  </header>

  <section class="v5-hero">
    <div class="v5-step-dots">
      <span class="v5-step-dot is-done"></span>
      <span class="v5-step-dot is-done"></span>
      <span class="v5-step-dot is-active"></span>
      <span class="v5-step-dot"></span>
      <span class="v5-step-dot"></span>
      <span class="v5-step-dot"></span>
      <span class="v5-step-dot"></span>
    </div>
    <div class="v5-hero__eyebrow">Step 3 · Tell us about you</div>
    <div class="v5-hero__big-headline" style="padding: 8px 0 4px;">
      What's your <em>position</em>?
    </div>
    <div style="font-size: 12px; color: var(--c-text-tertiary); letter-spacing: 0.06em; margin-top: 4px;">We'll tailor your drills around it</div>
  </section>

  <div class="v5-pos-grid">
    <a href="#" class="v5-pos-btn"><div class="v5-pos-btn__num">1</div><div class="v5-pos-btn__lbl">PG</div></a>
    <a href="#" class="v5-pos-btn"><div class="v5-pos-btn__num">2</div><div class="v5-pos-btn__lbl">SG</div></a>
    <a href="#" class="v5-pos-btn is-active"><div class="v5-pos-btn__num">3</div><div class="v5-pos-btn__lbl">SF</div></a>
    <a href="#" class="v5-pos-btn"><div class="v5-pos-btn__num">4</div><div class="v5-pos-btn__lbl">PF</div></a>
    <a href="#" class="v5-pos-btn"><div class="v5-pos-btn__num">5</div><div class="v5-pos-btn__lbl">C</div></a>
  </div>

  <a href="home.html" class="v5-card v5-card--amber">
    <div class="v5-card__l">
      <div class="v5-card__lbl">Skip · Set up later</div>
      <div class="v5-card__title">Skip onboarding for now</div>
    </div>
    <span class="v5-card__arrow">›</span>
  </a>

  <a href="home.html" class="v5-cta">Continue <span class="v5-cta__arrow">→</span></a>

</main>

<nav class="v5-bottom-nav">
  <a href="home.html"  class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/></svg></span><span class="v5-nav-item__lbl">Home</span></a>
  <a href="track.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg></span><span class="v5-nav-item__lbl">Track</span></a>
  <a href="train.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6"/><rect x="19" y="9" width="3" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span><span class="v5-nav-item__lbl">Train</span></a>
  <a href="coach.html" class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 1 6 0"/><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><circle cx="12" cy="8" r="4"/></svg></span><span class="v5-nav-item__lbl">Coach</span></a>
  <a href="me.html"    class="v5-nav-item"><span class="v5-nav-item__icon"><svg class="v5-bn-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><span class="v5-nav-item__lbl">Me</span></a>
</nav>

</body>
</html>
