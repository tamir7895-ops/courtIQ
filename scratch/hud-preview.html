<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CourtIQ — Live HUD preview</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet">
<link rel="stylesheet" href="/app-v10/styles/tokens.css" />
<link rel="stylesheet" href="/app-v10/styles/components.css" />
<link rel="stylesheet" href="/app-v10/styles/v11.css" />
<style>
  /* Stand-in for the camera feed so contrast can be judged honestly. */
  html,body{margin:0;height:100%;background:#101820;}
  #feed{position:fixed;inset:0;background:
    radial-gradient(circle at 50% 32%, #5b6b78 0%, #2c3a46 45%, #16202a 100%);}
  #feed:after{content:'';position:absolute;left:38%;top:22%;width:24%;height:9%;
    border:6px solid #ff5a1f;border-radius:50%;opacity:.85;}
</style>
</head>
<body>
<div id="feed"></div>
<div id="v10-cam-layer"></div>
<script src="/app-v10/lib/ui.js"></script>
<script>
/* Mount the REAL hudLayer markup from camera-hud.js by mirroring it, then
   drive it exactly like startPolling does — so the preview exercises the
   shipped CSS, not a mock-up. */
var h = window.V10UI.h;
function hudLayer() {
  return h('div', { id: 'v11-hud', class: 'v11-hud v11-hud--live' }, [
    h('div', { class: 'v11-hud__frame' }),
    h('div', { class: 'v11-hud__top' }, [
      h('div', { class: 'v11-hud__pill', id: 'v11-hud-pill' }, [
        h('span', { class: 'v11-hud__dot' }),
        h('span', { class: 'v11-hud__pilltxt', id: 'v11-hud-state', text: 'Tracking the hoop' })
      ])
    ]),
    h('div', { class: 'v11-hud__num', id: 'v11-hud-timer', text: '0:00' }),
    h('div', { class: 'v11-hud__cap' }, [ h('div', { class: 'v11-hud__capfill', id: 'v11-hud-capfill' }) ]),
    h('div', { class: 'v11-hud__meta' }, [
      h('span', { class: 'v11-hud__chip' }, [
        h('span', { class: 'v11-hud__chipnum', id: 'v10-cam-num', text: '0' }),
        h('span', { class: 'v11-hud__chiplbl', text: 'shots detected' })
      ])
    ]),
    h('div', { class: 'v11-hud__lost', id: 'v11-hud-lost', style: { display: 'none' }, text: 'Lost the hoop' }),
    h('div', { id: 'v10-backend-badge', style: {
      position:'absolute', top:'calc(env(safe-area-inset-top, 0px) + 8px)', left:'10px',
      font:'10px/1.4 ui-monospace, Menlo, monospace', color:'rgba(255,255,255,0.55)',
      background:'rgba(0,0,0,0.35)', padding:'3px 7px', borderRadius:'6px',
      letterSpacing:'0.04em', pointerEvents:'none', zIndex:'5'
    }, text: 'webgpu · 60ms' })
  ]);
}
document.getElementById('v10-cam-layer').appendChild(hudLayer());

var CAP = 5*60*1000;
var t0 = Date.now(); var shots = 0;
window.__setElapsed = function (ms) { t0 = Date.now() - ms; tick(); };
window.__setShots  = function (n) { shots = n; document.getElementById('v10-cam-num').textContent = String(n); };
window.__setLost   = function (lost) {
  document.getElementById('v11-hud-pill').classList.toggle('is-lost', lost);
  document.getElementById('v11-hud-state').textContent = lost ? 'Hoop lost — reframe' : 'Tracking the hoop';
  var hud = document.getElementById('v11-hud');
  hud.classList.toggle('v11-hud--lost', lost); hud.classList.toggle('v11-hud--live', !lost);
  document.getElementById('v11-hud-lost').style.display = lost ? 'block' : 'none';
};
function tick() {
  var ms = Date.now() - t0, s = Math.floor(ms/1000);
  document.getElementById('v11-hud-timer').textContent = Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
  var frac = Math.max(0, Math.min(1, ms/CAP));
  var f = document.getElementById('v11-hud-capfill');
  f.style.width = (frac*100).toFixed(1)+'%';
  f.classList.toggle('is-near', frac >= 0.8);
}
setInterval(tick, 250); tick();
</script>
</body>
</html>
