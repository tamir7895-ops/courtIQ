# CourtIQ — cloud iOS build + TestFlight upload (no local Mac needed).
# Signing: explicit fetch-or-CREATE flow — on a brand-new app there are no
# existing certificates/profiles, so the automatic ios_signing lookup fails
# with "No matching profiles found"; `fetch-signing-files --create` registers
# the bundle id (if missing), creates a distribution certificate and an
# App Store provisioning profile on the fly via the `COURTIQ` ASC key.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: COURTIQ
    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.courtiq.ios
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web + sync iOS bundle (pruned to ~25MB)
        script: npm run ios:sync
      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
