# CourtIQ — cloud iOS build + TestFlight upload (no local Mac needed).
# Signing: explicit fetch-or-CREATE flow — on a brand-new app there are no
# existing certificates/profiles, so the automatic ios_signing lookup fails
# with "No matching profiles found"; `fetch-signing-files --create` registers
# the bundle id (if missing), creates a distribution certificate and an
# App Store provisioning profile on the fly via the `courtiq-asc` ASC key.
#
# CREATING the distribution certificate needs a private key. A multi-line PEM
# gets mangled travelling through a browser/Windows clipboard into the env var
# (CRLF, collapsed newlines) and the CLI then rejects it as "not valid". So we
# store the key BASE64-ENCODED (single line, mangle-proof) as a Secure env var
# CERTIFICATE_PRIVATE_KEY in a Codemagic variable group `appstore`, and decode
# it back to a PEM file at build time (see the signing step). To produce it:
#   ssh-keygen -t rsa -b 2048 -m PEM -f ios_distribution_private_key -q -N ""
#   base64 the file, one line, and paste that as the env var value.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Without this block the workflow only ever starts from a manual
    # "Start new build" click in the Codemagic UI — which is why a push to
    # master shipped the web fix to Pages (GitHub Actions) while TestFlight
    # sat on the previous build. Scoped to master so feature branches don't
    # burn mac_mini_m2 minutes; requires the Codemagic app to be connected
    # to the repo with its webhook registered.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    integrations:
      app_store_connect: courtiq-asc
    environment:
      groups:
        - appstore          # must contain CERTIFICATE_PRIVATE_KEY (Secure)
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.courtiq.ios
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web + sync iOS bundle (pruned to ~25MB)
        script: npm run ios:sync
      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: |
          set -e
          # CERTIFICATE_PRIVATE_KEY should hold the base64 of the distribution
          # private key (single line). Accept a raw PEM too, in case it was
          # pasted directly. Diagnostics below reveal the FORMAT (not the
          # secret) so a bad paste is obvious in the log.
          echo "== signing-key diagnostics =="
          echo "CERTIFICATE_PRIVATE_KEY length = ${#CERTIFICATE_PRIVATE_KEY}"
          echo "first 16 chars = $(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | head -c 16)"
          if printf '%s' "$CERTIFICATE_PRIVATE_KEY" | grep -q "BEGIN"; then
            echo "detected raw PEM -> normalising newlines"
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\r' > /tmp/cert_key.pem
          else
            echo "detected base64 -> decoding"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\r\n ' | openssl base64 -d -A > /tmp/cert_key.pem
          fi
          echo "decoded first line = $(head -1 /tmp/cert_key.pem)"
          if ! openssl rsa -in /tmp/cert_key.pem -check -noout; then
            echo "!! /tmp/cert_key.pem is NOT a valid RSA key — fix the CERTIFICATE_PRIVATE_KEY env var"
            exit 1
          fi
          echo "== private key valid, fetching signing files =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
